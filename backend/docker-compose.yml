version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: luxury_booking_db
    environment:
      POSTGRES_USER: ${DB_USER:-booking_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking_password}
      POSTGRES_DB: ${DB_NAME:-luxury_booking_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-booking_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking_network

  backend:
    build: .
    container_name: luxury_booking_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://${DB_USER:-booking_user}:${DB_PASSWORD:-booking_password}@postgres:5432/${DB_NAME:-luxury_booking_db}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this}
      DEBUG: ${DEBUG:-False}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - booking_network

volumes:
  postgres_data:
    driver: local

networks:
  booking_network:
    driver: bridge
